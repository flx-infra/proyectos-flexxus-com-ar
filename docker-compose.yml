# ---------------------------------------------------------------------------
# Gestion de Proyectos - proyectos.flexxus.com.ar
#
# Codigo e imagen: bitbucket.org/flexxus_id/flxgestorproyectos
# Este repo es solo el stack: lo que Portainer despliega.
#
# Una sola imagen: Express sirve la API (/api) y el frontend compilado.
# La base Firebird de SAR queda afuera y se configura por variables.
#
# Variables que hay que cargar en el stack: SERVICE_NAME, NODE, LOKI_URL,
# DOMAIN_NAME, DB_HOST, DB_PORT, DB_PATH, DB_USER, DB_PASSWORD,
# JWT_SECRET, JWT_REFRESH_SECRET. El volumen de adjuntos entra como invitado: no
# necesita variables.
# Sin DB_PASSWORD o sin los JWT la aplicacion no arranca (los valida al inicio).
# ---------------------------------------------------------------------------
version: '3.6'

services:
  gestion-proyectos:
    image: fabreguesm/gestion-proyectos:0.1.5
    hostname: proyectos-flexxus-com-ar
    # Temporal, hasta que el dominio este en Cloudflare: acceso directo por
    # http://<ip del entorno>:4100. Sacarlo cuando ande https://${DOMAIN_NAME}.
    ports:
      - '4100:4100'
    networks:
      - traefik
    volumes:
      - 'logs:/app/logs'
      # Adjuntos de SAR (Gantt), solo lectura. worker3 llega a 192.168.121.21:445 desde el
      # 23/10/2026. Si el servidor de archivos no responde, Swarm no puede montarlo y el servicio
      # no arranca: en ese caso volver a comentar esta linea y el volumen "adjuntos" de abajo.
      - 'adjuntos:/mnt/flexxus:ro'
    environment:
      # NODE_ENV=production, PORT=4100 y TZ ya vienen en la imagen.
      # TZ es obligatoria: node-firebird interpreta los TIMESTAMP en la zona del proceso.
      - DB_HOST=${DB_HOST}
      - DB_PORT=${DB_PORT}
      - DB_PATH=${DB_PATH}
      - DB_USER=${DB_USER}
      - DB_PASSWORD=${DB_PASSWORD}
      - DB_POOL_MAX=10
      - JWT_SECRET=${JWT_SECRET}
      - JWT_REFRESH_SECRET=${JWT_REFRESH_SECRET}
      - JWT_EXPIRES_IN=60m
      - JWT_REFRESH_EXPIRES_IN=12h
      - LOGIN_MAX_INTENTOS=5
      - LOGIN_VENTANA_MIN=15
      - CORS_ORIGIN=https://${DOMAIN_NAME}
      # SAR guarda las rutas de Windows de los adjuntos; S: es \\192.168.121.21\flexxus.
      # Sin la carpeta montada, el Gantt lista los adjuntos pero no los deja descargar.
      - ADJUNTOS_RAICES=S:\=/mnt/flexxus;\\192.168.121.21\flexxus=/mnt/flexxus
    # Reemplaza el healthcheck de la imagen, que pega a /api/health y da 503
    # cuando no hay conexion con Firebird. Con ese, una base caida o lenta hace
    # que Swarm mate el contenedor en loop aunque la aplicacion este sana.
    # Aca solo se verifica que el proceso responda; el estado de la base se ve
    # en https://${DOMAIN_NAME}/api/health.
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:4100/ || exit 1"]
      interval: 30s
      timeout: 10s
      start_period: 20s
      retries: 3
    deploy:
      placement:
        constraints: ["${NODE}"]
      labels:
        - "traefik.enable=true"
        - "traefik.http.routers.${SERVICE_NAME}-http.entrypoints=web"
        - "traefik.http.routers.${SERVICE_NAME}-http.rule=Host(`${DOMAIN_NAME}`)"
        - "traefik.http.middlewares.${SERVICE_NAME}-http.redirectscheme.scheme=https"
        - "traefik.http.routers.${SERVICE_NAME}-https.rule=Host(`${DOMAIN_NAME}`)"
        - "traefik.http.routers.${SERVICE_NAME}-https.entrypoints=https"
        - "traefik.http.routers.${SERVICE_NAME}-https.tls=true"
        - "traefik.http.routers.${SERVICE_NAME}-https.tls.certresolver=myresolver"
        - "traefik.http.services.${SERVICE_NAME}-http.loadbalancer.server.port=4100"
      restart_policy:
        condition: any
        delay: 10s
    logging:
      driver: loki
      options:
        loki-url: ${LOKI_URL}

volumes:
  # Solo bitacoras (api.log, app.log, error.log). Los datos viven en Firebird:
  # perder este volumen no pierde informacion de negocio.
  logs:
    name: "${SERVICE_NAME}_logs"
  # Recurso compartido de SAR (Samba), solo lectura (ver la nota en volumes del servicio). Lo
  # monta el nodo (worker3) por CIFS como invitado (username=guest, sin clave). Probado el
  # 23/10/2026 en worker3: este Samba no acepta vers=3.0 ("operation not supported") y la opcion
  # "guest" sola da "permission denied"; con username=guest y vers=2.1 monta y lee.
  # Si algun dia pide cuenta, cambiar username=guest,password= por
  # username=${ADJUNTOS_SMB_USER},password=${ADJUNTOS_SMB_PASS} y cargar esas variables en
  # Portainer (la clave no puede tener comas: separan las opciones del montaje).
  adjuntos:
    name: "${SERVICE_NAME}_adjuntos"
    driver: local
    driver_opts:
      type: cifs
      device: "//192.168.121.21/flexxus"
      o: "addr=192.168.121.21,username=guest,password=,ro,vers=2.1,iocharset=utf8,file_mode=0444,dir_mode=0555"

networks:
  traefik:
    external: true
    name: traefik-network
